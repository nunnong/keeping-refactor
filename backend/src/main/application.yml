server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ssafy_fintech_db
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update     # 운영에서는 validate 권장
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: true

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 2000

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: keeping-payment-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.ssafy.keeping.domain.charge.event"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3

  #  fe:
  #    base-url: http://localhost:3030


  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: 8f7d038e1e68f41ef9ddb00e2868fb31
            client-secret: ***REMOVED***
            client-name: Kakao
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/auth/kakao/callback"
            scope:
              - profile_image
              - account_email
            client-authentication-method: client_secret_post

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id


